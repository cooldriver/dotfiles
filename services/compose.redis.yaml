name: dev-redis
services:
  redis:
    image: ${REDIS_IMAGE:?Set an explicit compatible Redis image tag or digest}
    platform: linux/arm64
    restart: "no"
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  redis-data:
