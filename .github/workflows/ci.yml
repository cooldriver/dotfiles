name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Linux validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh shellcheck stow direnv
      - name: Install macOS validation tools
        if: runner.os == 'macOS'
        run: brew install shellcheck stow direnv
      - name: Install Python linter
        run: python -m pip install -r requirements-dev.txt
      - name: Check Bash and Zsh without executing configs
        run: bash scripts/check-shell.sh
      - name: Lint Python tests
        run: python -m ruff check --no-cache .
      - name: Run offline tests in temporary homes
        run: python -B -m unittest discover -s tests -v
