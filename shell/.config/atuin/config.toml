# Manual sync by default; Tatooine's Zsh host config enables automatic sync.
# Toola's shell stays manual; its optional LAN-only LaunchAgent runs `atuin sync`.
sync_address = "https://atuin.hwapp.ovh"
auto_sync = false
update_check = false

[daemon]
enabled = false

[ui]
columns = ["duration", "time", "host", "command"]
